<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stubble-X Thumbnail</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800&family=Inter:wght@600&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1a1a;
            font-family: 'Outfit', sans-serif;
        }

        .thumbnail-container {
            width: 1280px;
            height: 720px;
            position: relative;
            background: linear-gradient(105deg, 
                rgba(22, 101, 52, 1) 0%, 
                rgba(21, 128, 61, 1) 40%, 
                rgba(30, 58, 138, 1) 60%, 
                rgba(30, 64, 175, 1) 100%);
            display: flex;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        /* Abstract shapes */
        .circle-1 {
            position: absolute;
            top: -100px;
            left: -100px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(234, 179, 8, 0.4) 0%, rgba(234, 179, 8, 0) 70%);
            border-radius: 50%;
            filter: blur(40px);
        }

        .circle-2 {
            position: absolute;
            bottom: -150px;
            right: -100px;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.4) 0%, rgba(59, 130, 246, 0) 70%);
            border-radius: 50%;
            filter: blur(60px);
        }

        /* Glassmorphism Card */
        .glass-card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 60%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 140px;
            margin: 0;
            background: linear-gradient(to right, #ffffff, #eab308);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(0,0,0,0.3);
            letter-spacing: -4px;
            line-height: 1;
        }

        h2 {
            font-family: 'Inter', sans-serif;
            font-size: 40px;
            color: #e2e8f0;
            margin: 10px 0 0 0;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.9;
        }

        .badges {
            display: flex;
            gap: 20px;
            margin-top: 40px;
        }

        .badge {
            background: rgba(255, 255, 255, 0.15);
            padding: 12px 30px;
            border-radius: 50px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 20px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Decorative Grid */
        .grid-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
        }

        /* Icons placeholder */
        .icon-leaf { color: #84cc16; }
        .icon-tech { color: #60a5fa; }

    </style>
</head>
<body>
    <div class="thumbnail-container">
        <div class="grid-overlay"></div>
        <div class="circle-1"></div>
        <div class="circle-2"></div>

        <div class="glass-card">
            <h1>Stubble-X</h1>
            <h2>Farm Waste to Wealth</h2>
            
            <div class="badges">
                <div class="badge"><span class="icon-leaf">🌿</span> Sustainable</div>
                <div class="badge"><span class="icon-tech">🤖</span> AI Powered</div>
                <div class="badge">🚀 Farm Tech</div>
            </div>
        </div>
    </div>
</body>
</html>
